<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Close-up of dewy, healthy skin texture">
  <defs>
    <linearGradient id="tx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e6da"/>
      <stop offset="55%" stop-color="#f5ded1"/>
      <stop offset="100%" stop-color="#e7d3e2"/>
    </linearGradient>
    <radialGradient id="tx-light" cx="34%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tx-pores"><feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#tx-bg)"/>
  <rect width="400" height="400" fill="url(#tx-light)"/>
  <!-- dew droplets -->
  <g>
    <circle cx="150" cy="150" r="30" fill="#ffffff" opacity="0.5"/>
    <circle cx="142" cy="142" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="270" cy="220" r="20" fill="#ffffff" opacity="0.45"/>
    <circle cx="264" cy="214" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="210" cy="300" r="14" fill="#ffffff" opacity="0.4"/>
    <circle cx="320" cy="130" r="11" fill="#ffffff" opacity="0.5"/>
  </g>
  <rect width="400" height="400" filter="url(#tx-pores)" opacity="0.55"/>
</svg>
