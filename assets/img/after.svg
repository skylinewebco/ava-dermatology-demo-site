<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="After placeholder — smooth, radiant skin">
  <defs>
    <linearGradient id="af-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbeee4"/>
      <stop offset="60%" stop-color="#f7e6da"/>
      <stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <radialGradient id="af-glow" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="af-tex"><feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="400" height="520" fill="url(#af-bg)"/>
  <rect width="400" height="520" fill="url(#af-glow)"/>
  <circle cx="150" cy="170" r="26" fill="#ffffff" opacity="0.4"/>
  <circle cx="143" cy="163" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="280" cy="330" r="16" fill="#ffffff" opacity="0.35"/>
  <rect width="400" height="520" filter="url(#af-tex)" opacity="0.5"/>
</svg>
