<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Luxury skincare serum bottle in soft light">
  <defs>
    <linearGradient id="se-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#d8e7f6"/>
    </linearGradient>
    <linearGradient id="se-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="50%" stop-color="#b7d6f2"/>
      <stop offset="100%" stop-color="#7fb4e6"/>
    </linearGradient>
    <linearGradient id="se-liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbe5c9"/>
      <stop offset="100%" stop-color="#a7d3c6"/>
    </linearGradient>
    <radialGradient id="se-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="se-soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="400" height="500" fill="url(#se-bg)"/>
  <ellipse cx="200" cy="220" rx="150" ry="170" fill="url(#se-glow)" filter="url(#se-soft)"/>
  <!-- dropper cap -->
  <rect x="168" y="60" width="64" height="70" rx="10" fill="#cddff0"/>
  <rect x="184" y="30" width="32" height="40" rx="8" fill="#b7d0e8"/>
  <!-- bottle -->
  <rect x="140" y="130" width="120" height="300" rx="34" fill="url(#se-glass)"/>
  <rect x="152" y="250" width="96" height="168" rx="26" fill="url(#se-liq)" opacity="0.9"/>
  <!-- highlight -->
  <rect x="160" y="150" width="16" height="250" rx="8" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="228" cy="180" rx="10" ry="26" fill="#ffffff" opacity="0.35"/>
  <!-- label -->
  <rect x="164" y="300" width="72" height="70" rx="8" fill="#ffffff" opacity="0.55"/>
  <rect x="176" y="322" width="48" height="6" rx="3" fill="#6ba6df" opacity="0.7"/>
  <rect x="182" y="338" width="36" height="5" rx="2.5" fill="#6ba6df" opacity="0.5"/>
</svg>
